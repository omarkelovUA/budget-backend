# Local-dev Postgres. Started automatically by spring-boot-docker-compose on `./mvnw spring-boot:run`.
services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=familybudget'
      - 'POSTGRES_USER=familybudget'
      - 'POSTGRES_PASSWORD=familybudget'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'

volumes:
  postgres-data:
