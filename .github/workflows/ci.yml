name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integration tests use Testcontainers; GitHub's Ubuntu runners have Docker.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t budget-app-backend:ci .
