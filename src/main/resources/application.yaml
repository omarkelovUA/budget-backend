spring:
  application:
    name: budget-app-backend
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            # Placeholders keep the app bootable without Google credentials; Google login
            # itself only works once GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET are set.
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,profile,email

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Where the SPA lives; the Google login redirects back here (ARCHITECTURE.md §6.1).
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  security:
    jwt:
      # HMAC key for signing/validating our own access tokens (ARCHITECTURE.md §6.1).
      # The default is for local dev only - always override JWT_SECRET outside it.
      secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
      access-token-ttl: 15m
    refresh-token:
      ttl: 30d
      # A rotated token replayed within this window (e.g. two tabs refreshing at once)
      # is just rejected; replayed later, it revokes all of the user's sessions.
      reuse-grace: 30s
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      # Daily purge of expired refresh tokens (RefreshTokenCleanup).
      cleanup-cron: '0 30 3 * * *'
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Who may open the operator page (ARCHITECTURE.md §3.5): comma-separated emails of
  # Google-linked accounts. Empty: nobody.
  operator:
    emails: ${APP_OPERATOR_EMAILS:}
  family:
    invite-ttl: 7d
  subscription:
    google-play:
      # The Android app's application id; Google's notifications for other apps are ignored.
      package-name: ${GOOGLE_PLAY_PACKAGE_NAME:app.familybudget}
      # Path to the service account's JSON key (ARCHITECTURE.md §3.4). Empty: purchases
      # can't be checked, manual grants still work.
      credentials: ${GOOGLE_PLAY_CREDENTIALS:}
      # Google's notifications arrive as Pub/Sub pushes with an OIDC token for this
      # audience, signed for this service account (ARCHITECTURE.md §6.1).
      push-audience: ${GOOGLE_PLAY_PUSH_AUDIENCE:not-configured}
      push-service-account: ${GOOGLE_PLAY_PUSH_SERVICE_ACCOUNT:not-configured}
    # Daily re-check of Play purchases near or past their expiry (SubscriptionRecheck).
    recheck-cron: '0 0 4 * * *'
