spring:
  application:
    name: budget-app-backend
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      # HMAC key for signing/validating our own access tokens (ARCHITECTURE.md §6.1).
      # The default is for local dev only - always override JWT_SECRET outside it.
      secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
